<div class="form-group">
  <label>{{ 'mno_enterprise.templates.components.currency_select.checkbox' | translate }}</label>
  <div ng-repeat="currency in currencies">
    <label>
      <input type="checkbox" ng-model="currency.selected" style="">
      {{currency.id}}
    </label>
  </div>
</div>

<div class="form-group">
  <label class="control-label" for="currency-select">
    {{ 'mno_enterprise.templates.components.currency_select.selectbox' | translate }}
  </label>
  <select id="currency-select" class="form-control" ng-model="defaultCurrency" ng-change="changeCurrency()" ng-options="currency.id for currency in currencies | filter:{selected:true}">
  </select>
</div>

<button class="btn btn-warning" type="button" ng-disabled="(defaultCurrency == null)" ng-click="changeCurrencyList()">Save</button>
